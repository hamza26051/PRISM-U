seed: 42

data:
  root: ./data/cifar10
  split_file: ./splits/cifar10_seed42.json
  target_train_size: 40000
  auxiliary_size: 5000
  validation_size: 5000
  forget_fraction: 0.10
  num_workers: 2

model:
  name: resnet18_cifar
  num_classes: 10

training:
  epochs: 40
  batch_size: 128
  learning_rate: 0.1
  momentum: 0.9
  weight_decay: 0.0005
  scheduler_milestones: [20, 30]
  scheduler_gamma: 0.1
  label_smoothing: 0.0

evaluation:
  batch_size: 256
  save_probabilities: true

paths:
  checkpoints: ./checkpoints
  results: ./results
